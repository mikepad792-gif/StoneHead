[build]
  publish = "build"
  command = "npm run build"
  functions = "api"

[dev]
  command = "npm start"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# API route redirects -> Netlify Functions
# Existing (Thread 1 & 2):
[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/chat/send"
  to = "/.netlify/functions/chat-send"
  status = 200

[[redirects]]
  from = "/api/profile/get"
  to = "/.netlify/functions/profile-get"
  status = 200

[[redirects]]
  from = "/api/profile/age-verify"
  to = "/.netlify/functions/profile-age-verify"
  status = 200

[[redirects]]
  from = "/api/usage/check"
  to = "/.netlify/functions/usage-check"
  status = 200

# New (Thread 3):
[[redirects]]
  from = "/api/threads/list"
  to = "/.netlify/functions/threads-list"
  status = 200

[[redirects]]
  from = "/api/threads/create"
  to = "/.netlify/functions/threads-create"
  status = 200

[[redirects]]
  from = "/api/threads/messages"
  to = "/.netlify/functions/threads-messages"
