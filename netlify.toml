[[redirects]]
  from = "/api/threads/toggle-data"
  to = "/.netlify/functions/threads-toggle-data"
  status = 200

[[redirects]]
  from = "/api/threads/delete"
  to = "/.netlify/functions/threads-delete"
  status = 200

[[redirects]]
  from = "/api/threads/rename"
  to = "/.netlify/functions/threads-rename"
  status = 200

[[redirects]]
  from = "/api/strains/search"
  to = "/.netlify/functions/strains-search"
