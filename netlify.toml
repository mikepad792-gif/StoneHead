[build]
  publish = "build"
  command = "npm run build"
  functions = "api"

[dev]
  command = "npm start"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**"]

# Security headers for every response.
# TODO: add a Content-Security-Policy as a follow-up with a report-only
# rollout — CRA's build emits inline chunks, and a broken CSP is worse
# than none.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

