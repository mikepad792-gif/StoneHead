<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e110d" />
  <title>StoneHead AI</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0e110d; color: #ece8dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .box { padding: 24px; max-width: 320px; }
    img { width: 96px; height: 96px; border-radius: 50%; }
    h1 { font-size: 20px; font-weight: 600; margin: 16px 0 8px; }
    p { color: #b4b3a3; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #6f9a4a; color: #0e110d; border: 0; border-radius: 999px;
      padding: 12px 28px; font-size: 15px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/images/stonehead-avatar-clean.png" alt="" />
    <h1>no signal, man</h1>
    <p>StoneHead needs a connection to talk. check your wifi or data and try again.</p>
    <button onclick="location.reload()">try again</button>
  </div>
</body>
</html>
